name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  lint:
    name: Lint (detekt + ktlint + Android Lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: detekt (allRules, ktlint, Compose rules)
        run: ./gradlew detekt
      - name: Fetch sherpa-onnx
        run: scripts/fetch-sherpa-onnx.sh
      - name: Android Lint
        run: ./gradlew :app:lintDebug
      - name: Annotate Android Lint issues
        if: failure()
        run: |
          jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // "app"),line=\(.locations[0].physicalLocation.region.startLine // 1)::[\(.ruleId)] \(.message.text)"' \
            app/build/reports/lint-results-debug.sarif || true
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-reports
          path: |
            build/reports/detekt/
            app/build/reports/lint-results-*.html
      - name: Upload SARIF to code scanning
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

  build:
    name: Test & build APK
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Fetch sherpa-onnx
        run: scripts/fetch-sherpa-onnx.sh

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/kurmish-fitness-debug.apk
          # Без движка и детектора речи голосовой ввод не работает: проверяем, что они попали в сборку.
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/silero_vad.onnx'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/kurmish-fitness.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: apk
          path: dist/*.apk

      # Постоянная ссылка на свежий APK из main:
      # https://github.com/<owner>/<repo>/releases/download/latest/kurmish-fitness.apk
      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Latest build (main)" --notes "Автосборка из main."
          gh release edit latest --notes "Автосборка из main, коммит ${GITHUB_SHA::7}."
          # В latest кладём только подписанный APK: debug каждый раз подписан новым ключом и не ставится поверх.
          gh release delete-asset latest kurmish-fitness-debug.apk -y 2>/dev/null || true
          if [ -f dist/kurmish-fitness.apk ]; then
            gh release upload latest dist/kurmish-fitness.apk --clobber
          else
            gh release upload latest dist/kurmish-fitness-debug.apk --clobber
          fi

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

  # Зеркало модели распознавания речи в релизе voice-model: приложение качает её отсюда при первой
  # голосовой записи (запасной адрес — Hugging Face). Модель заливается один раз.
  voice-model:
    name: Mirror voice model
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Upload GigaAM v3 to the voice-model release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: https://huggingface.co/csukuangfj/sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16/resolve/main
        run: |
          gh release view voice-model >/dev/null 2>&1 || \
            gh release create voice-model --prerelease --title "Voice model" \
              --notes "GigaAM v3 CTC int8 для sherpa-onnx (лицензия MIT). Приложение скачивает её при первой голосовой записи."
          assets=$(gh release view voice-model --json assets -q '.assets[].name')
          for file in tokens.txt model.int8.onnx; do
            if ! grep -qx "$file" <<<"$assets"; then
              curl -fL --retry 4 --retry-delay 5 -o "$file" "$SOURCE/$file"
              gh release upload voice-model "$file"
            fi
          done
