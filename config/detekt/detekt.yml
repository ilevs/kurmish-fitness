# Поверх дефолтного конфига с allRules = true. Здесь только осознанные ослабления под Compose.
config:
  validation: true
  warningsAsErrors: true

build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

comments:
  # Требуем KDoc у публичного API, но не у переопределений (onCreate и т.п.)
  UndocumentedPublicFunction:
    excludes: ['**/test/**']
  UndocumentedPublicClass:
    excludes: ['**/test/**']
  UndocumentedPublicProperty:
    excludes: ['**/test/**']

formatting:
  # ktlint с конфигурацией из .editorconfig
  android: true
  autoCorrect: true

Compose:
  ModifierMissing:
    checkModifiersForVisibility: only_public
